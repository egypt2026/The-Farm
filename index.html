<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>المزرعة - The Farm | المنيو</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
button,input,textarea{font-family:inherit}
:root{--bg:#f5f8ee;--card:#fff;--tx:#2b1b17;--mu:#7a6a60;--rd:#2e7d32;--bd:#d9e4c4;--gr:#e07b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c16;--card:#1f2a22;--tx:#eef5ea;--mu:#a5b8a8;--bd:#34463a;--rd:#4caf50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141c16;--card:#1f2a22;--tx:#eef5ea;--mu:#a5b8a8;--bd:#34463a;--rd:#4caf50;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo",Tahoma,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(135deg,#388e3c,#1b5e20);color:#fff;text-align:center;padding:22px 14px 16px;border-radius:0 0 26px 26px}
.lg{width:130px;height:auto;border-radius:18px;border:3px solid #fff;display:block;margin:0 auto 6px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
.offer{display:inline-block;line-height:1.5;background:#ffe082;color:#1b3d1e;font-weight:bold;border-radius:20px;padding:5px 14px;margin-top:10px;font-size:14px}
.sr{padding:12px 14px 4px}.sr input{width:100%;padding:12px 16px;border-radius:24px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
nav button.on{background:var(--rd);color:#fff;border-color:var(--rd)}
main{padding:4px 14px}h2{font-size:18px;color:var(--rd);margin:14px 0 8px}.note{font-size:12px;color:var(--mu);margin:-4px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.ph{width:76px;height:76px;object-fit:cover;border-radius:12px;flex:none;background:var(--bd)}.tx{flex:1;min-width:0}.c b{font-size:15px}.c small{display:block;color:var(--mu);font-size:12px;margin-top:3px}.pr{color:var(--rd);font-weight:bold;margin-top:4px;font-size:15px}
.add,.q button{background:var(--rd);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;padding:6px 0;font-size:18px}.q span{min-width:20px;text-align:center;font-weight:bold}
#bar{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;background:var(--gr);color:#fff;border:0;border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;font-size:16px;font-weight:bold;cursor:pointer;z-index:9;box-shadow:0 6px 20px #0004;width:calc(100% - 24px)}
#ov{position:fixed;inset:0;background:#0008;display:none;z-index:20;align-items:flex-end}
#sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#sh input,#sh textarea{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.tp{display:flex;gap:8px;margin:10px 0}.tp button{flex:1;padding:10px 4px;font-size:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}.tp button.on{background:var(--rd);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.tot{font-size:18px;font-weight:bold;display:flex;justify-content:space-between;margin:12px 0}
.send{width:100%;background:var(--gr);color:#fff;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:bold;cursor:pointer}
.x{float:left;background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
footer{text-align:center;color:var(--mu);font-size:12px;padding:16px}
</style></head><body>

function csv(t){const r=[];let w=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){w.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;w.push(f);r.push(w);w=[];f=""}else f+=c}if(f||w.length){w.push(f);r.push(w)}return r}
